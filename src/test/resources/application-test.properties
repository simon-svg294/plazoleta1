# Perfil de pruebas: no necesita MySQL ni una base de datos externa.
spring.datasource.url=jdbc:h2:mem:plazoleta;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

jwt.secret=test-secret-key-for-unit-tests-2026
jwt.expiration=3600000

logging.level.org.springframework.security=WARN
