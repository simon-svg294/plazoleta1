spring.application.name=Plazoleta

# Base de datos
# Los valores por defecto son solo para desarrollo local. En produccion define
# las variables DB_URL, DB_USERNAME y DB_PASSWORD.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/plazoleta_db?serverTimezone=America/Bogota&allowPublicKeyRetrieval=true&useSSL=false}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}

# JPA: las tablas las crea docs/script.sql, Hibernate solo valida
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=${JPA_FORMAT_SQL:false}

# Security
# En produccion define JWT_SECRET con una clave propia de al menos 32 caracteres.
jwt.secret=${JWT_SECRET:dev-only-secret-change-me-please-2026}
jwt.expiration=${JWT_EXPIRATION:3600000}

# OpenAPI / Swagger UI
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha

# Logs
logging.level.org.springframework.security=${SECURITY_LOG_LEVEL:INFO}
