spring.application.name=Plazoleta

# Base de datos
spring.datasource.url=jdbc:mysql://localhost:3306/plazoleta_db?serverTimezone=America/Bogota&allowPublicKeyRetrieval=true&useSSL=false
spring.datasource.username=root
spring.datasource.password=root

# JPA: las tablas las crea docs/script.sql, Hibernate solo valida
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Security
jwt.secret=PonAquiUnaClaveTuyaDeMasDe32Caracteres2026
jwt.expiration=3600000

# OpenAPI / Swagger UI
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha

# Logs (útil mientras depuras el login; puedes quitarlo después)
logging.level.org.springframework.security=DEBUG